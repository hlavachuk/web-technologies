<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Урок 19 — Форма в один рядок</title><link rel="stylesheet" href="../reset.css"><link rel="stylesheet" href="style.css"></head><body id="exercise-top">


  <div class="cover">


    <form  class="flex-form">

      <input type="search" aria-label="Destination" placeholder="Where do you want to go?" required>

      <label for="from">From</label>
      <input id="from" type="date" required>

      <label for="to">To</label>
      <input id="to" type="date" required>

      <select aria-label="Guests">
        <option value="1">1 Guest</option>
        <option value="2">2 Guest</option>
        <option value="3">3 Guest</option>
        <option value="4">4 Guest</option>
        <option value="5">5 Guest</option>
      </select>

      <input type="submit" value="Search">

    </form>

  </div>

  <video aria-label="Decorative background" class="dog" src="Coverr-Lulu/Coverr-Lulu.webm" autoplay muted loop></video>

</body></html>
